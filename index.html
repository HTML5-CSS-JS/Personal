<!doctype HTML>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>hello</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono&family=Noto+Sans+KR&family=Noto+Sans+JP&family=Noto+Sans+SC&family=Noto+Sans+TC&family=Noto+Color+Emoji&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&family=Noto+Sans+Math&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 
                'Noto Sans Mono',
                'Noto Sans KR',
                'Noto Sans JP',
                'Noto Sans SC',
                'Noto Sans TC',
                'Noto Color Emoji',
                'Noto Sans Symbols',
                'Noto Sans Symbols 2',
                'Noto Sans Math',
                sans-serif;
        }

        /* 라이트 모드 */
        @media (prefers-color-scheme: light) {
            body {
                background-color: #fff;
                color: #000;
            }
            a {
                text-decoration: none;
                color: #0275d8; /* 라이트 모드 기본 파란색 */
            }
            a:hover {
                color: #0263b8; /* 호버 시 더 진한 파란색 */
            }
            a:invalid {
                color: #f00; /* 없는 링크 빨간색 */
            }
            del, s {
                color: #808080; /* 회색 */
            }
        }

        /* 다크 모드 */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000; /* OLED 번인 방지 */
                color: #fff;
            }
            a {
                text-decoration: none;
                color: #ec9f19; /* 기본 주황색 */
            }
            a:hover {
                color: #bd7f14; /* 호버 시 어두운 주황색 */
            }
            a:invalid {
                color: #f00; /* 없는 링크 빨간색 */
            }
            del, s {
                color: #808080; /* 회색 */
            }
        }
    </style>
</head>
<body>
    <h1>라이트/다크 모드 테스트</h1>
    <p><a href="#">정상 링크</a></p>
    <p><a href="invalid://">없는 링크</a></p>
    <p><del>삭제된 텍스트</del> 와 <s>취소선 텍스트</s></p>
    <pre>추가 예정</pre>
</body>
</html>
